[package]
name = "hop"
version = "0.1.0"
description = "A minimal macOS app launcher"
license = "MIT"
edition = "2024"

[lib]
name = "hop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
# the versions tauri already pulls in
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
