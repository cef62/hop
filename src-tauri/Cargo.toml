[package]
name = "hop"
version = "0.1.0"
description = "A minimal macOS app launcher"
license = "MIT"
edition = "2024"

[lib]
name = "hop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
# the versions tauri already pulls in
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSFileManager", "NSGeometry", "NSString"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
